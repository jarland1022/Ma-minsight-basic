[project]
name = "ma-minsight"
version = "0.1.0"
description = "MA-MinSight Community — SIEM alert triage (ingest / rule triage / aggregation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.2.0",
    "geoip2>=4.8.0",
    "cryptography>=43.0.0",
]

[project.scripts]
ma-ti-sync = "app.threat_intel.cli:main"
ma-entity-seed = "app.entity_seed.cli:main"
ma-entity-relations-import = "app.entity_seed.relations_cli:main"
ma-geo-enrich = "app.geoip.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["playbooks/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
