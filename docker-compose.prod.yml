# Optional production overrides: logging, ulimits
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
