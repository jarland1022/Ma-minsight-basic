# Minimal CI for P0-06 R-B: egress bypass gate + privacy contract tests
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  privacy-and-egress-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Egress bypass static gate
        run: python scripts/check_egress_bypass.py

      - name: Privacy + CI bypass tests
        run: python -m pytest tests/privacy -q --tb=short
